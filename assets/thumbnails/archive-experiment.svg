<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Archive Experiment thumbnail">
  <rect width="800" height="500" fill="#F7F1E3"/>
  <!-- Stacked paper documents -->
  <!-- Back layer -->
  <rect x="160" y="100" width="480" height="340" rx="6" fill="#E8DFC8" stroke="#2A241B" stroke-width="1.5" opacity="0.5" transform="rotate(-6 400 270)"/>
  <!-- Middle layer -->
  <rect x="160" y="100" width="480" height="340" rx="6" fill="#EFE6CE" stroke="#2A241B" stroke-width="1.5" opacity="0.65" transform="rotate(3 400 270)"/>
  <!-- Front page -->
  <rect x="160" y="100" width="480" height="340" rx="6" fill="#FFF9EC" stroke="#2A241B" stroke-width="1.5"/>
  <!-- Ruled lines on front page -->
  <line x1="200" y1="175" x2="600" y2="175" stroke="#2A241B" stroke-width="1" opacity="0.15"/>
  <line x1="200" y1="210" x2="600" y2="210" stroke="#2A241B" stroke-width="1" opacity="0.15"/>
  <line x1="200" y1="245" x2="600" y2="245" stroke="#2A241B" stroke-width="1" opacity="0.15"/>
  <line x1="200" y1="280" x2="600" y2="280" stroke="#2A241B" stroke-width="1" opacity="0.15"/>
  <line x1="200" y1="315" x2="600" y2="315" stroke="#2A241B" stroke-width="1" opacity="0.15"/>
  <line x1="200" y1="350" x2="600" y2="350" stroke="#2A241B" stroke-width="1" opacity="0.15"/>
  <!-- Colored ink marks on lines (simulating handwriting) -->
  <rect x="200" y="170" width="180" height="5" rx="2" fill="#4F6F3E" opacity="0.4"/>
  <rect x="200" y="205" width="260" height="5" rx="2" fill="#2A241B" opacity="0.25"/>
  <rect x="200" y="240" width="140" height="5" rx="2" fill="#2A241B" opacity="0.2"/>
  <rect x="200" y="275" width="220" height="5" rx="2" fill="#2A241B" opacity="0.22"/>
  <!-- Small stamp / seal -->
  <circle cx="540" cy="390" r="34" fill="none" stroke="#B9825B" stroke-width="2" opacity="0.55"/>
  <circle cx="540" cy="390" r="26" fill="none" stroke="#B9825B" stroke-width="1.2" opacity="0.4"/>
  <text x="540" y="395" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#B9825B" opacity="0.6">✦</text>
  <!-- Corner fold -->
  <path d="M600,100 L640,140 L600,140Z" fill="#E8DFC8" stroke="#2A241B" stroke-width="1" opacity="0.5"/>
  <!-- Paperclip -->
  <path d="M220,108 Q210,100 210,115 Q210,130 225,130 Q240,130 240,115 Q240,100 228,100 Q216,100 216,115" stroke="#6F675C" stroke-width="2.5" fill="none" opacity="0.6"/>
</svg>
