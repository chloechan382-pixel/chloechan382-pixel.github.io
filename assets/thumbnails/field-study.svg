<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Field Study thumbnail">
  <rect width="800" height="500" fill="#F7F1E3"/>
  <!-- Grid lines (field notebook feel) -->
  <g opacity="0.12" stroke="#263A24" stroke-width="0.8">
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>
  <!-- Botanical sketches in grid cells -->
  <!-- Cell 1: simple tree -->
  <circle cx="150" cy="160" r="38" fill="none" stroke="#4F6F3E" stroke-width="1.8"/>
  <line x1="150" y1="198" x2="150" y2="240" stroke="#4F6F3E" stroke-width="2"/>
  <!-- Cell 2: leaf -->
  <path d="M300,120 Q330,150 300,190 Q270,150 300,120Z" fill="none" stroke="#6E7F45" stroke-width="1.8"/>
  <line x1="300" y1="155" x2="300" y2="190" stroke="#6E7F45" stroke-width="1.2"/>
  <!-- Cell 3: flower -->
  <circle cx="500" cy="155" r="14" fill="none" stroke="#B9825B" stroke-width="1.8"/>
  <circle cx="500" cy="130" r="9" fill="none" stroke="#B9825B" stroke-width="1.5"/>
  <circle cx="522" cy="143" r="9" fill="none" stroke="#B9825B" stroke-width="1.5"/>
  <circle cx="522" cy="167" r="9" fill="none" stroke="#B9825B" stroke-width="1.5"/>
  <circle cx="500" cy="180" r="9" fill="none" stroke="#B9825B" stroke-width="1.5"/>
  <circle cx="478" cy="167" r="9" fill="none" stroke="#B9825B" stroke-width="1.5"/>
  <circle cx="478" cy="143" r="9" fill="none" stroke="#B9825B" stroke-width="1.5"/>
  <!-- Cell 4: grass -->
  <path d="M650,200 Q655,160 648,140" stroke="#8FAF7A" stroke-width="2" fill="none"/>
  <path d="M660,200 Q668,155 665,130" stroke="#8FAF7A" stroke-width="2" fill="none"/>
  <path d="M670,200 Q672,162 679,145" stroke="#8FAF7A" stroke-width="2" fill="none"/>
  <!-- Cell 5: seed/berry -->
  <circle cx="150" cy="350" r="20" fill="#D6A84F" opacity="0.7"/>
  <path d="M150,330 Q160,310 150,295" stroke="#4F6F3E" stroke-width="1.5" fill="none"/>
  <!-- Cell 6: fern frond -->
  <path d="M300,400 Q310,370 305,340" stroke="#4F6F3E" stroke-width="1.5" fill="none"/>
  <path d="M305,355 Q320,348 325,338" stroke="#4F6F3E" stroke-width="1.2" fill="none"/>
  <path d="M303,368 Q290,360 286,350" stroke="#4F6F3E" stroke-width="1.2" fill="none"/>
  <path d="M305,380 Q318,373 322,362" stroke="#4F6F3E" stroke-width="1.2" fill="none"/>
  <!-- Annotation marks -->
  <text x="130" y="258" font-family="Georgia, serif" font-size="11" fill="#6F675C" opacity="0.7">fig. 1</text>
  <text x="278" y="205" font-family="Georgia, serif" font-size="11" fill="#6F675C" opacity="0.7">fig. 2</text>
  <text x="478" y="205" font-family="Georgia, serif" font-size="11" fill="#6F675C" opacity="0.7">fig. 3</text>
</svg>
