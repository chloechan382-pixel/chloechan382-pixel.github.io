<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Pasture Notes thumbnail">
  <!-- Sky gradient -->
  <defs>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D6E8C9"/>
      <stop offset="100%" stop-color="#C8DEB8"/>
    </linearGradient>
    <linearGradient id="ground1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8FAF7A"/>
      <stop offset="100%" stop-color="#4F6F3E"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="800" height="500" fill="url(#sky1)"/>
  <!-- Far hills -->
  <ellipse cx="200" cy="280" rx="360" ry="140" fill="#6E7F45" opacity="0.5"/>
  <ellipse cx="650" cy="300" rx="300" ry="110" fill="#4F6F3E" opacity="0.45"/>
  <!-- Ground -->
  <rect y="320" width="800" height="180" fill="url(#ground1)"/>
  <!-- Foreground bump -->
  <ellipse cx="400" cy="320" rx="500" ry="60" fill="#4F6F3E"/>
  <!-- Sun -->
  <circle cx="650" cy="100" r="48" fill="#D6A84F" opacity="0.75"/>
  <!-- Small clouds -->
  <ellipse cx="160" cy="90" rx="70" ry="28" fill="#FFF9EC" opacity="0.55"/>
  <ellipse cx="200" cy="82" rx="50" ry="22" fill="#FFF9EC" opacity="0.45"/>
  <ellipse cx="380" cy="120" rx="55" ry="22" fill="#FFF9EC" opacity="0.4"/>
  <!-- Fence line -->
  <line x1="60" y1="350" x2="740" y2="350" stroke="#263A24" stroke-width="2" opacity="0.4"/>
  <line x1="120" y1="340" x2="120" y2="365" stroke="#263A24" stroke-width="2.5" opacity="0.4"/>
  <line x1="240" y1="340" x2="240" y2="365" stroke="#263A24" stroke-width="2.5" opacity="0.4"/>
  <line x1="360" y1="340" x2="360" y2="365" stroke="#263A24" stroke-width="2.5" opacity="0.4"/>
  <line x1="480" y1="340" x2="480" y2="365" stroke="#263A24" stroke-width="2.5" opacity="0.4"/>
  <line x1="600" y1="340" x2="600" y2="365" stroke="#263A24" stroke-width="2.5" opacity="0.4"/>
  <line x1="720" y1="340" x2="720" y2="365" stroke="#263A24" stroke-width="2.5" opacity="0.4"/>
  <!-- Grass blades -->
  <path d="M180,320 Q185,300 178,285" stroke="#263A24" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M320,315 Q326,293 318,278" stroke="#263A24" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M520,318 Q527,296 519,281" stroke="#263A24" stroke-width="1.5" fill="none" opacity="0.5"/>
</svg>
